name: Build 3DS files
on:
  workflow_dispatch:
  push:
jobs:
  manager:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manager app
        run: |
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          dkp-pacman -S --noconfirm --needed 3ds-dev || true
          cd manager
          arm-none-eabi-gcc -D__3DS__ -O2 -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -I${DEVKITPRO}/libctru/include main.c -specs=3dsx.specs -L${DEVKITPRO}/libctru/lib -lctru -lm -o mk7bot_manager.elf
          3dsxtool mk7bot_manager.elf mk7bot_manager.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: mk7bot_manager
          path: manager/mk7bot_manager.3dsx
  plugin:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        run: |
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          dkp-pacman -S --noconfirm --needed 3ds-dev || true
          printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' >> /opt/devkitpro/pacman/etc/pacman.conf
          dkp-pacman -Sy
          dkp-pacman -S --noconfirm libctrpf
          ls /opt/devkitpro/libctrpf
          git clone --depth 1 https://github.com/PabloMK7/CTRPluginFramework-BlankTemplate.git tpl
          ls tpl tpl/Sources
          rm -f tpl/Sources/*.cpp
          cp plugin.cpp tpl/Sources/main.cpp
          cd tpl && make
          cp *.3gx ../MK7Bot.3gx
      - uses: actions/upload-artifact@v4
        with:
          name: MK7Bot_plugin
          path: MK7Bot.3gx
